<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TP3 - Gestion de tâches</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    button.active { background: #1f6feb; color: white; }
    .tache { border: 1px solid #ccc; padding: .5rem 1rem; margin: .5rem 0; }
    .terminee { background: #e6ffe6; }
    .terminee h3 { text-decoration: line-through; }
  </style>
</head>
<body>
  <div id="app">
    <task-list></task-list>
  </div>

  <script>
    const TaskList = {
      template: `
        <div>
          <h1>Mes tâches</h1>
          <p>Nombre total de tâches : {{ totalTaches }}</p>

          <button :class="{ active: filtre === 'toutes' }" @click="filtre = 'toutes'">Toutes</button>
          <button :class="{ active: filtre === 'afaire' }" @click="filtre = 'afaire'">À faire</button>
          <button :class="{ active: filtre === 'terminees' }" @click="filtre = 'terminees'">Terminées</button>

          <div v-for="t in tachesFiltrees" :key="t.id" class="tache" :class="{ terminee: t.completed }">
            <h3>{{ t.title }}</h3>
            <p>{{ t.description }}</p>
            <button v-show="!t.completed" @click="terminer(t)">Marquer comme terminée</button>
          </div>

          <p v-if="tachesFiltrees.length === 0">Aucune tâche à afficher.</p>
        </div>
      `,
      data() {
        return {
          taches: [],
          filtre: 'toutes'
        }
      },
      computed: {
        totalTaches() {
          return this.taches.length
        },
        tachesFiltrees() {
          if (this.filtre === 'afaire') return this.taches.filter(t => !t.completed)
          if (this.filtre === 'terminees') return this.taches.filter(t => t.completed)
          return this.taches
        }
      },
      methods: {
        terminer(tache) {
          tache.completed = true
        }
      },
      async mounted() {
        try {
          const reponse = await fetch('taskList.json')
          this.taches = await reponse.json()
        } catch (e) {
          // Secours si la page est ouverte directement (file://) : copie des données
          this.taches = [
            { id: 1, title: 'Faire les courses', description: 'Acheter des légumes et du lait.', completed: false },
            { id: 2, title: 'Faire du sport', description: 'Courir pendant 30 minutes.', completed: true },
            { id: 3, title: "Réviser pour l'examen", description: 'Relire le chapitre 5 du manuel.', completed: false }
          ]
        }
      }
    }

    const app = Vue.createApp({})
    app.component('TaskList', TaskList)
    app.mount('#app')
  </script>
</body>
</html>
