<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    .book { border: 1px solid #ccc; padding: .5rem; margin: .5rem 0; cursor: pointer; }
    .fav { background: #fff3cd; }
    .chip { background: #ddd; border-radius: 1rem; padding: 0 .5rem; margin-right: .3rem; display: inline-block; }
  </style>
</head>
<body>
  <div id="app">
    <form @submit.prevent="ajouterLivre">
      <input type="text" v-model="newBook.title" placeholder="Titre">
      <input type="text" v-model="newBook.author" placeholder="Auteur">
      <input type="number" v-model.number="newBook.year" placeholder="Année">
      <select v-model="newBook.genre">
        <option>Roman</option>
        <option>Science-fiction</option>
        <option>Histoire</option>
      </select>
      Favori <input type="checkbox" v-model="newBook.isFav">

      <input type="text" v-model="nouveauMotCle" placeholder="Mot-clé + Entrée"
             @keydown.enter.prevent @keyup.enter="ajouterMotCle">

      <button :disabled="!formulaireValide">Ajouter</button>
    </form>

    <div>
      <span class="chip" v-for="k in newBook.keywords" :key="k">
        {{ k }} <button type="button" @click="retirerMotCle(k)">×</button>
      </span>
    </div>

    <div class="book" :class="{ fav: book.isFav }" v-for="book in books" :key="book.id" @click="toggleFavori(book)">
      <h3>{{ book.title }} <span v-if="book.isFav">⭐</span></h3>
      <p>{{ book.author }} - {{ book.year }} - {{ book.genre }}</p>
      <span class="chip" v-for="k in book.keywords" :key="k">{{ k }}</span>
      <br>
      <button @click.stop="supprimerLivre(book)">Supprimer</button>
    </div>
  </div>

  <script>
    Vue.createApp({
      data() {
        return {
          books: [
            { id: 1, title: 'Dune', author: 'Frank Herbert', year: 1965, genre: 'Science-fiction', isFav: true, keywords: ['désert', 'épopée'] },
            { id: 2, title: 'Germinal', author: 'Émile Zola', year: 1885, genre: 'Roman', isFav: false, keywords: ['mine'] }
          ],
          newBook: { title: '', author: '', year: 2024, genre: 'Roman', isFav: false, keywords: [] },
          nouveauMotCle: ''
        }
      },
      computed: {
        formulaireValide() {
          return this.newBook.title.trim() !== '' && this.newBook.author.trim() !== ''
        }
      },
      methods: {
        ajouterLivre() {
          this.books.push({ ...this.newBook, id: Date.now(), keywords: [...this.newBook.keywords] })
          this.newBook = { title: '', author: '', year: 2024, genre: 'Roman', isFav: false, keywords: [] }
        },
        supprimerLivre(book) {
          this.books = this.books.filter(b => b.id !== book.id)
        },
        toggleFavori(book) {
          book.isFav = !book.isFav
        },
        ajouterMotCle() {
          const mot = this.nouveauMotCle.trim()
          if (mot !== '' && !this.newBook.keywords.includes(mot)) {
            this.newBook.keywords.push(mot)
          }
          this.nouveauMotCle = ''
        },
        retirerMotCle(mot) {
          this.newBook.keywords = this.newBook.keywords.filter(k => k !== mot)
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
