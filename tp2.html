<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet 1-38</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        img { float: left; margin-right: 1rem; }
        .personne { clear: left; padding: 1rem; }
        input[type="checkbox"], select { margin-right: 1rem; }
        .misEnForme {
            background: #e0ffff;
            font-family: georgia;
            font-size: 1.2rem;
            margin: 1rem;
        }
    </style>
</head>

<body>
    <div id="app">
        <fieldset>
            <legend>Filtre sur le nom</legend>
            <input type="text" v-model="filtreNom" placeholder="Nom ou prénom">
        </fieldset>

        <fieldset>
            <legend>Options</legend>
            Homme <input type="checkbox" v-model="homme">
            Femme <input type="checkbox" v-model="femme">
            Téléphone <input type="checkbox" v-model="tel">
            Photo
            <select v-model="taille">
                <option value="1">Petit</option>
                <option value="2">Moyen</option>
                <option value="3">Grand</option>
            </select>
            Mise en forme <input type="checkbox" v-model="mef">
        </fieldset>

        <div class="personne" v-for="p in personnesFiltrees" :key="p.login.uuid">
            <div :class="{ misEnForme: mef }">
                <img :src="photo(p)" :alt="p.name.last">

                {{ p.name.title }} {{ p.name.first }} {{ p.name.last }}<br>
                <div>{{ p.location.country }}</div>

                <button @click="p.contactVisible = !p.contactVisible">
                    {{ p.contactVisible ? 'Masquer' : 'Afficher' }} les contacts
                </button>

                <div v-if="p.contactVisible">
                    <div v-if="tel">Tél : {{ p.phone }}</div>
                    <div>Email : {{ p.email }}</div>
                </div>
            </div>
        </div>

        <p v-if="personnesFiltrees.length === 0">Aucune personne à afficher.</p>
    </div>

    <script>
        const app = Vue.createApp({
            data() {
                return {
                    homme: true,
                    femme: true,
                    tel: true,
                    mef: false,
                    taille: 2,
                    filtreNom: '',
                    personnes: [
                        {
                            gender: "female",
                            name: { title: "Mrs", first: "Elizabeth", last: "Ambrose" },
                            location: { country: "Canada" },
                            email: "elizabeth.ambrose@example.com",
                            login: { uuid: "50777e60-394d-4951-b933-a2f78599065d" },
                            phone: "366-033-8063",
                            picture: {
                                large: "https://randomuser.me/api/portraits/women/49.jpg",
                                medium: "https://randomuser.me/api/portraits/med/women/49.jpg",
                                thumbnail: "https://randomuser.me/api/portraits/thumb/women/49.jpg"
                            }
                        },
                        {
                            gender: "male",
                            name: { title: "Mr", first: "Batista", last: "Silveira" },
                            location: { country: "Brazil" },
                            email: "batista.silveira@example.com",
                            login: { uuid: "5308f02b-7838-4b48-8114-2fe1349c0819" },
                            phone: "(53) 5553-2892",
                            picture: {
                                large: "https://randomuser.me/api/portraits/men/50.jpg",
                                medium: "https://randomuser.me/api/portraits/med/men/50.jpg",
                                thumbnail: "https://randomuser.me/api/portraits/thumb/men/50.jpg"
                            }
                        },
                        {
                            gender: "male",
                            name: { title: "Mr", first: "Blaise", last: "Adam" },
                            location: { country: "Switzerland" },
                            email: "blaise.adam@example.com",
                            login: { uuid: "3f7d9b90-8858-4986-bdf3-075df560ce31" },
                            phone: "079 493 00 77",
                            picture: {
                                large: "https://randomuser.me/api/portraits/men/29.jpg",
                                medium: "https://randomuser.me/api/portraits/med/men/29.jpg",
                                thumbnail: "https://randomuser.me/api/portraits/thumb/men/29.jpg"
                            }
                        }
                    ]
                }
            },
            computed: {
                personnesFiltrees() {
                    const filtre = this.filtreNom.toLowerCase()
                    return this.personnes.filter(p => {
                        const okGenre = (this.homme && p.gender === 'male')
                                     || (this.femme && p.gender === 'female')
                        const nomComplet = (p.name.first + ' ' + p.name.last).toLowerCase()
                        const okNom = nomComplet.includes(filtre)
                        return okGenre && okNom
                    })
                }
            },
            methods: {
                photo(p) {
                    if (this.taille == 1) return p.picture.thumbnail
                    if (this.taille == 3) return p.picture.large
                    return p.picture.medium
                }
            }
        });
        app.mount('#app');
    </script>
</body>
</html>
